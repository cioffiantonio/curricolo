<style>

.cv{padding:7cqw 7cqw 11cqw;position:relative;--k:.66}

.stp{display:flex;align-items:center;border:1.5px solid var(--ink);border-radius:12px;overflow:hidden;flex:none}
.stp button{width:36px;height:38px;border:0;background:var(--card);font:inherit;font-weight:800;font-size:20px;color:var(--ink);cursor:pointer}
.stp input{width:48px;height:38px;text-align:center;border:0;border-left:1.5px solid var(--ink);border-right:1.5px solid var(--ink);border-radius:0;margin:0;padding:0;font-size:16px}
.fb{width:38px;height:38px;border:1.5px solid var(--ink);border-radius:10px;background:var(--card);font:inherit;font-size:16px;font-weight:800;color:var(--ink);cursor:pointer;flex:none}
.fb.on{background:var(--ink);color:var(--bg)}
.tbc button:disabled,.tbc select:disabled,.tbc input:disabled{opacity:.4;cursor:not-allowed}
.tbc .chip{padding:7px 11px;font-size:13px}
.tbc .sws{width:34px;height:34px;flex:none;margin-left:auto}
.pop{position:absolute;left:0;right:0;top:100%;background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:12px;z-index:7;margin-top:-4px}
.pop .hb{margin-bottom:2px}
.hxl{display:flex;align-items:center;gap:8px;margin-top:12px;font-weight:700}
.hxl input{margin:0;padding:6px 10px}
.up{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:8;border:2px solid var(--ink);background:var(--bl);color:var(--onbl);border-radius:99px;padding:10px 16px;font:inherit;font-weight:800;font-size:14px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .2s}
.up.on{opacity:1;pointer-events:auto}
.cv [data-g]{cursor:pointer}
.cv [data-sl]{outline:.5cqw solid #2f6fed;outline-offset:.3cqw;border-radius:.4cqw}
.cv header img{max-width:40cqw;max-height:40cqw;object-fit:cover}
.cv.laterale header *,.cv.laterale .side *,.cv.laterale .pi *{color:#fff!important}
.cv.banner header *{color:#fff!important}
.cv.banner header .ro{color:#FFD93D!important}
.gl2{font-size:14px;font-weight:700;margin:16px 0 6px}
.tbf{display:flex;flex-direction:column;gap:3px;min-width:0}
.tbcap{font-size:11px;font-weight:700;color:var(--mut)}
.tbc .tbf .sws{margin-left:0}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:20;padding:20px}
.ovc{background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:18px;max-width:340px;width:100%}

.cv .pi2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.5fr);gap:1.6cqw 3cqw;margin-top:2cqw}
.cv .pi2 .pr{display:flex;align-items:flex-start;gap:1.3cqw;min-width:0}
.cv .pi2 .pr span{min-width:0;overflow-wrap:anywhere}
.cv .pi2 .ic{margin-top:.08em}
.cv .p3{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.5fr);gap:1.4cqw 3cqw}
.cv .p3 .pr{display:block;min-width:0}
.cv .p3 .pr b{display:block;min-width:0;opacity:.7}
.cv .p3 .pr span{overflow-wrap:anywhere}
.cv.laterale .pi2{display:block;margin:0}
.cv.laterale .pi2 .pr{display:flex;margin-bottom:1.4cqw}
.cv.laterale .ic,.cv.banner .ic{fill:#fff}
.cv.banner .ic{fill:#FFD93D}
.cv.duo header{flex-direction:row;flex-wrap:wrap}
.cv.duo header .pi2{flex:0 0 100%;order:3;margin-top:1cqw}
.cv.duo header img{margin-left:3cqw}
